<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jyoti Kumari Verma | Training Portal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            /* Ambient background glows */
            background-image:
                radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        /* Glassmorphism Base */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Bento Box Layout */
        .bento-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: auto auto;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 1. Profile Section (Left Sidebar) */
        .profile-card {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile-card img.logo {
            width: 60px;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .profile-card h1 {
            font-size: 2rem;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-card h2 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'JetBrains Mono', monospace;
        }

        /* 2. Days Grid (Top Right) */
        .days-section {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
        }

        .day-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 12px;
            color: var(--text-main);
            transition: all 0.3s ease;
            text-align: center;
        }

        .day-btn .day-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: var(--accent);
            margin: 0;
            font-weight: 700;
        }

        .day-btn .day-title {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .day-btn:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
            background: rgba(6, 182, 212, 0.05);
        }

        /* 3. Assets Section (Bottom Right) */
        .assets-section {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .asset-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .asset-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        .asset-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
            background: rgba(6, 182, 212, 0.05);
        }

        .asset-card:hover .asset-icon {
            transform: scale(1.1);
        }

        .asset-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .asset-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .bento-grid {
                grid-template-columns: 1fr;
            }

            .profile-card,
            .days-section,
            .assets-section {
                grid-column: 1 / -1;
                grid-row: auto;
            }

            .assets-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="bento-grid">

        <!-- Sidebar / Profile -->
        <div class="glass-panel profile-card">
            <div>
                <img src="logo.jpg" alt="Logo" class="logo" onerror="this.style.display='none'">
                <h1>Jyoti Kumari Verma</h1>
                <h2>Guru Nanak Dev Engineering College</h2>

                <div class="badge-container">
                    <span class="badge">B.Tech CSE</span>
                    <span class="badge">TR-103</span>
                    <span class="badge">CRN: 2315117</span>
                    <span class="badge">URN: 2302573</span>
                </div>

            </div>
        </div>

        <!-- 20 Days Grid -->
        <div class="glass-panel days-section">
            <div class="section-header">
                <h3>TR-103:Work</h3>
                <span
                    style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--accent);"></span>
            </div>

            <div class="days-grid">
                <!-- Using JavaScript to dynamically generate the 20 days keeps your HTML clean -->
                <script>
                    for (let i = 1; i <= 20; i++) {
                        document.write(`
            <a href="pdfs/day${i}.pdf" target="_blank" class="day-btn">
                <span class="day-num">DAY ${i}</span>
            </a>
        `);
                    }
                </script>
            </div>
        </div>

        <!-- Documents / Downloads -->
        <div class="assets-section">
            <a href="report/final_training_report.pdf" target="_blank" class="glass-panel asset-card">
                <div class="asset-icon">📑</div>
                <h3>Final Report</h3>
            </a>

            <a href="project/project_work.pdf" target="_blank" class="glass-panel asset-card">
                <div class="asset-icon">💻</div>
                <h3>Project Work</h3>
            </a>

            <a href="certificate/jyoti_certificate.jpg" target="_blank" class="glass-panel asset-card">
                <div class="asset-icon">🎓</div>
                <h3>Certificate</h3>
            </a>
        </div>

    </div>

</body>

</html>
